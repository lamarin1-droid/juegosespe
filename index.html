<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamer Fest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gf-bg: #f2eefc;
      --gf-ink: #1d1b3a;
      --gf-magenta: #e4358a;
      --gf-cyan: #12a9bd;
      --gf-yellow: #ffc533;
      --gf-surface: #ffffff;
    }
    body {
      font-family: "Outfit", sans-serif;
      background: var(--gf-bg);
      color: var(--gf-ink);
    }
    h1, h2, h3, .brand { font-family: "Bungee", sans-serif; font-weight: 400; }

    /* Menú lateral (izquierda) */
    .sidebar {
      background: var(--gf-ink);
      color: #fff;
    }
    @media (min-width: 992px) {
      .sidebar { position: sticky; top: 0; height: 100vh; }
    }
    .brand { font-size: 1.6rem; color: var(--gf-yellow); text-decoration: none; }
    .sidebar .nav-link {
      color: #fff;
      border: 2px solid rgba(255,255,255,.25);
      border-radius: 50rem;
      padding: .6rem 1.2rem;
      font-weight: 700;
      transition: background .15s, border-color .15s, color .15s;
    }
    .sidebar .nav-link:hover,
    .sidebar .nav-link:focus-visible {
      background: var(--gf-magenta);
      border-color: var(--gf-magenta);
      color: #fff;
    }
    .sidebar .nav-link.j2:hover, .sidebar .nav-link.j2:focus-visible { background: var(--gf-cyan); border-color: var(--gf-cyan); }
    .sidebar .nav-link.j3:hover, .sidebar .nav-link.j3:focus-visible { background: var(--gf-yellow); border-color: var(--gf-yellow); color: var(--gf-ink); }

    /* Espacio para imagen */
    .img-slot {
      aspect-ratio: 4 / 3;
      width: 100%;
      border: 3px dashed var(--gf-ink);
      border-radius: 1rem;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--gf-ink);
      overflow: hidden;
    }
    .img-slot img { width: 100%; height: 100%; object-fit: cover; }

    /* Hero */
    .hero {
      background: var(--gf-surface);
      border: 3px solid var(--gf-ink);
      border-radius: 1.25rem;
      box-shadow: 8px 8px 0 var(--gf-ink);
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; }

    .btn-gf { font-weight: 700; border: 2px solid var(--gf-ink); border-radius: 50rem; color: var(--gf-ink); }
    .btn-gf:hover { background: var(--gf-ink); color: #fff; }

    :focus-visible { outline: 3px solid var(--gf-magenta); outline-offset: 2px; }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">

    <!-- MENÚ -->
    <aside class="col-lg-3 col-xl-2 sidebar p-4">
      <a class="brand d-block mb-4" href="#inicio">Gamer Fest</a>
      <nav aria-label="Juegos">
        <ul class="nav flex-lg-column flex-row gap-3">
          <li class="nav-item"><a class="nav-link j1" href="j1.html" target="_blank" rel="noopener">Juego 1</a></li>
          <li class="nav-item"><a class="nav-link j2" href="j2.html" target="_blank" rel="noopener">Juego 2</a></li>
          <li class="nav-item"><a class="nav-link j3" href="j3.html" target="_blank" rel="noopener">Juego 3</a></li>
        </ul>
      </nav>
    </aside>

    <!-- CONTENIDO -->
    <main class="col-lg-9 col-xl-10 p-4 p-lg-5" id="inicio">

      <!-- Información general + imagen a la derecha -->
      <section class="hero p-4 p-lg-5 mb-5">
        <div class="row align-items-center g-4">
          <div class="col-md-7">
            <h1 class="mb-3">Información de 3 juegos</h1>
            <p class="fs-5">Bienvenido a Gamer Fest. Elige un juego desde el menú o desde las tarjetas de abajo. Cada juego se abre en una ventana nueva.</p>
            <div class="d-flex flex-wrap gap-2">
              <a href="j1.html" target="_blank" rel="noopener" class="btn btn-gf">Jugar Juego 1</a>
              <a href="j2.html" target="_blank" rel="noopener" class="btn btn-gf">Jugar Juego 2</a>
              <a href="j3.html" target="_blank" rel="noopener" class="btn btn-gf">Jugar Juego 3</a>
            </div>
          </div>
          <div class="col-md-5">
            <!-- Reemplaza el contenido por: <img src="imagenes/portada.jpg" alt="Gamer Fest"> -->
            <div class="img-slot">Espacio para imagen</div>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
