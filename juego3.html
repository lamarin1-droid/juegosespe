<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego 3 - Dragon Ball Z: BT3</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        :root {
            --bg-pastel: #fffcf7;
            --card-bg: #fff8f0;
            --primary-pastel: #e07a5f;
            --primary-hover: #d0694e;
            --nav-bg: #f7ede2;
            --text-main: #3d405b;
        }

        body {
            background-color: var(--bg-pastel);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
        }

        /* Navegación */
        .navbar-custom {
            background-color: var(--nav-bg);
            border-bottom: 2px solid #f2cc8f;
        }

        .navbar-custom .navbar-brand {
            color: var(--primary-pastel);
            font-weight: 700;
        }

        .navbar-custom .nav-link {
            color: var(--text-main);
            font-weight: 600;
            transition: color 0.3s;
        }

        .navbar-custom .nav-link:hover,
        .navbar-custom .nav-link.active {
            color: var(--primary-pastel);
        }

        /* Tarjeta del Juego */
        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid #f2cc8f;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(224, 122, 95, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(224, 122, 95, 0.18);
        }

        .card-custom .card-title {
            color: var(--primary-pastel);
            font-weight: 700;
        }

        .card-custom .card-text {
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Botón personalizado sin flecha */
        .btn-warm {
            background-color: var(--primary-pastel);
            color: #ffffff;
            border: none;
            border-radius: 50rem;
            padding: 0.6rem 1.8rem;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-warm:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-4" href="index.html">🎮 Juegos ESPE</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link active" href="juego3.html">Juego 3</a>
            </div>
        </div>
    </nav>

    <!-- Contenido del Juego -->
    <div class="container my-5">
        <h1 class="text-center fw-bold display-5 mb-5" style="color: var(--primary-pastel);">Dragon Ball Z: Budokai Tenkaichi 3</h1>
        
        <div class="card card-custom mx-auto" style="max-width: 650px;">
            <div class="position-relative">
                <img src="img/dragonball.jpg" class="card-img-top" alt="Dragon Ball Z Budokai Tenkaichi 3" style="max-height: 380px; object-fit: cover;">
            </div>
            <div class="card-body p-4 text-center">
                <h3 class="card-title mb-3">El mejor juego de peleas</h3>
                <p class="card-text mb-4 fs-6">
                    Prepárate para las batallas más épicas con una plantilla gigantesca de personajes, transformaciones espectaculares y gráficos increíbles.
                </p>
                <a href="index.html" class="btn btn-warm shadow-sm">Volver al inicio</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
