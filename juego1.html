<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego 1 - FIFA | Gamer Fest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gf-bg: #f2eefc;
      --gf-ink: #1d1b3a;
      --gf-magenta: #e4358a;
      --gf-cyan: #12a9bd;
      --gf-yellow: #ffc533;
    }
    body { font-family: "Outfit", sans-serif; background: var(--gf-bg); color: var(--gf-ink); min-height: 100vh; }
    h1, .brand { font-family: "Bungee", sans-serif; font-weight: 400; }

    .topbar { background: var(--gf-ink); }
    .brand { color: var(--gf-yellow); font-size: 1.4rem; text-decoration: none; }

    .panel {
      background: #fff;
      border: 3px solid var(--gf-ink);
      border-radius: 1.25rem;
      box-shadow: 8px 8px 0 var(--gf-ink);
    }
    .panel h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; }

    .img-slot {
      aspect-ratio: 4 / 3;
      width: 100%;
      border: 3px dashed var(--gf-ink);
      border-radius: 1rem;
      background: var(--gf-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .img-slot img { width: 100%; height: 100%; object-fit: cover; }

    .btn-gf { font-weight: 700; border: 2px solid var(--gf-ink); border-radius: 50rem; color: var(--gf-ink); background: #fff; }
    .btn-gf:hover { background: var(--gf-ink); color: #fff; }
    :focus-visible { outline: 3px solid var(--gf-magenta); outline-offset: 2px; }
  </style>
</head>
<body>

<header class="topbar py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="brand">Gamer Fest</span>
    <button class="btn btn-sm btn-gf" onclick="window.close()">Cerrar</button>
  </div>
</header>

<main class="container py-4 py-lg-5">
  <section class="panel p-4 p-lg-5">
    <div class="row align-items-center g-4">

      <!-- Texto -->
      <div class="col-md-7">
        <h1 class="mb-3">FIFA</h1>
        <p class="fs-5">
          FIFA es una de las sagas de videojuegos de fútbol más populares del mundo,
          desarrollada por EA Sports. Permite jugar partidos con selecciones y clubes reales,
          armar tu propio equipo y competir contra amigos o jugadores de todo el planeta.
        </p>
        <p class="mb-0">
          Desde 2023 la saga se llama EA Sports FC.
        </p>
      </div>

      <!-- Imagen -->
      <!-- Imagen -->
<div class="col-md-5">
  <div class="img-slot">
    <img src="imag/fifa.jpg" alt="FIFA - Gamer Fest">
  </div>
</div>
       

    </div>
  </section>
</main>

</body>
</html>
